name: Production Deploy

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      environment:
        description: Deployment environment
        required: true
        default: production
        type: choice
        options:
          - production
          - staging

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: "22"
  PROD_URL: "https://www.calqulus.site"

jobs:
  # ── Pre-deployment Quality Gates ──────────────────────────────────
  pre-deploy-gate:
    name: Quality Gate Check
    runs-on: ubuntu-latest
    outputs:
      can_deploy: ${{ steps.evaluate.outputs.can_deploy }}
      deployment_notes: ${{ steps.evaluate.outputs.notes }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check for production blocking issues
        id: evaluate
        run: |
          NOTES=""
          CAN_DEPLOY="true"

          # Check if this is a release tag
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            NOTES="Release tag detected: ${{ github.ref_name }}"
          else
            NOTES="Direct push to main branch"
          fi

          # Check for security updates needed
          if grep -q "security:\|fix:.*security\|CVE-" commit-msg.txt 2>/dev/null || \
             grep -q "security" package.json 2>/dev/null; then
            NOTES="$NOTES\n⚠️ Security-related changes detected"
          fi

          echo "can_deploy=$CAN_DEPLOY" >> $GITHUB_OUTPUT
          echo "notes=$NOTES" >> $GITHUB_OUTPUT

  # ── Build and Bundle Analysis ───────────────────────────────────────
  build:
    name: Production Build
    runs-on: ubuntu-latest
    needs: pre-deploy-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Reconcile production Supabase migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: npm run gate:reconciliation

      - name: Typecheck
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Production audit
        run: npm run audit:prod

      - name: Bundle size check
        run: |
          MAX_JS_SIZE=2500000  # 2.5MB max for main JS
          BUNDLE_SIZE=$(stat -c%s dist/assets/index-*.js 2>/dev/null | sort -n | tail -1 || echo 0)

          echo "Main bundle size: $BUNDLE_SIZE bytes"

          if [ "$BUNDLE_SIZE" -gt "$MAX_JS_SIZE" ]; then
            echo "::error title=Bundle Size Limit Exceeded::Bundle size $((BUNDLE_SIZE / 1024))KB exceeds 2.5MB maximum limit"
            exit 1
          fi

          echo "Bundle size: $((BUNDLE_SIZE / 1024))KB" >> $GITHUB_STEP_SUMMARY

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 7

  # ── Lighthouse Performance Check ───────────────────────────────────
  performance-check:
    name: Performance Audit
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL || 'https://example.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-anon-key' }}
          VITE_ENABLE_PUBLIC_DEMO: 'false'
          VITE_ENABLE_DEMO_SEED: 'false'

      - name: Install Playwright
        run: npx playwright install chromium --with-deps

      - name: Run preview server
        run: |
          npm run preview -- --host 0.0.0.0 --port 4173 &
          # Wait until the preview server responds before continuing
          for i in $(seq 1 30); do
            if curl -s -o /dev/null http://localhost:4173; then
              echo "Preview server is up"
              break
            fi
            sleep 1
          done
        env:
          PORT: 4173

      - name: Wait for server
        run: sleep 5

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v11
        with:
          urls: |
            http://localhost:4173
          budgetPath: ./lighthouse-budget.json
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ── E2E Test Verification ──────────────────────────────────────────
  e2e-tests:
    name: E2E Test Verification
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'pull_request' || contains(github.ref, 'release')
    env:
      VITE_SUPABASE_URL: ${{ secrets.E2E_SUPABASE_URL || 'https://example.supabase.co' }}
      VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.E2E_SUPABASE_PUBLISHABLE_KEY || 'ci-placeholder-anon-key' }}
      E2E_MANAGER_EMAIL: ${{ secrets.E2E_MANAGER_EMAIL }}
      E2E_MANAGER_PASSWORD: ${{ secrets.E2E_MANAGER_PASSWORD }}
      E2E_TENANT_EMAIL: ${{ secrets.E2E_TENANT_EMAIL }}
      E2E_TENANT_PASSWORD: ${{ secrets.E2E_TENANT_PASSWORD }}
      E2E_LANDLORD_EMAIL: ${{ secrets.E2E_LANDLORD_EMAIL }}
      E2E_LANDLORD_PASSWORD: ${{ secrets.E2E_LANDLORD_PASSWORD }}
      E2E_AGENCY_EMAIL: ${{ secrets.E2E_AGENCY_EMAIL }}
      E2E_AGENCY_PASSWORD: ${{ secrets.E2E_AGENCY_PASSWORD }}
      E2E_WEBHOST_EMAIL: ${{ secrets.E2E_WEBHOST_EMAIL }}
      E2E_WEBHOST_PASSWORD: ${{ secrets.E2E_WEBHOST_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        run: npm run test:e2e:ci

      - name: Upload E2E report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-report
          path: playwright-report/
          retention-days: 14

  # ── Deploy to Vercel ───────────────────────────────────────────────
  # Deploys via the Vercel CLI when VERCEL_TOKEN/VERCEL_ORG_ID/
  # VERCEL_PROJECT_ID secrets are configured. When they are not, the job
  # skips gracefully: this repo deploys to production automatically via
  # Vercel's native GitHub integration, so no Action secrets are required.
  deploy-vercel:
    name: Deploy to Vercel
    runs-on: ubuntu-latest
    needs: [pre-deploy-gate, build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
      url: ${{ steps.deploy.outputs.DEPLOY_URL || env.PROD_URL }}
    outputs:
      DEPLOY_URL: ${{ steps.deploy.outputs.DEPLOY_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check Vercel secrets
        id: check-secrets
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are all set."
            echo "deploy_enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "VERCEL_TOKEN, VERCEL_ORG_ID and VERCEL_PROJECT_ID are not all set."
            echo "deploy_enabled=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip Vercel CLI deploy
        if: steps.check-secrets.outputs.deploy_enabled != 'true'
        run: |
          echo "::notice title=Vercel CLI Deploy Skipped::VERCEL_TOKEN/VERCEL_ORG_ID/VERCEL_PROJECT_ID secrets are not configured. Production is deployed by Vercel's native GitHub integration (no Action secrets required). To enable CLI deploys from Actions, add the three secrets under Settings → Secrets and variables → Actions."

      - name: Install Vercel CLI
        if: steps.check-secrets.outputs.deploy_enabled == 'true'
        run: npm install -g vercel@latest

      - name: Link project (non-interactive)
        if: steps.check-secrets.outputs.deploy_enabled == 'true'
        run: |
          mkdir -p .vercel
          echo "{\"orgId\":\"$VERCEL_ORG_ID\",\"projectId\":\"$VERCEL_PROJECT_ID\"}" > .vercel/project.json
          echo "Wrote .vercel/project.json from VERCEL_ORG_ID/VERCEL_PROJECT_ID secrets"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Pull Vercel environment
        if: steps.check-secrets.outputs.deploy_enabled == 'true'
        run: vercel pull --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Build with Vercel
        if: steps.check-secrets.outputs.deploy_enabled == 'true'
        run: vercel build --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Deploy to Vercel (production)
        id: deploy
        if: steps.check-secrets.outputs.deploy_enabled == 'true'
        run: |
          set -o pipefail
          # Capture full output, extract the production deployment URL robustly.
          # `vercel deploy` prints the URL to stdout as the final line; grep for
          # an https URL to avoid picking up trailing confirmation/banner text.
          OUTPUT=$(vercel deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")
          echo "$OUTPUT"
          DEPLOY_URL=$(echo "$OUTPUT" | grep -oE 'https://[a-zA-Z0-9.-]+\.vercel\.app' | tail -n 1)
          if [ -z "$DEPLOY_URL" ]; then
            echo "::error title=Vercel Deploy::Could not parse deployment URL from vercel output"
            exit 1
          fi
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_OUTPUT"
          echo "Deployment URL: $DEPLOY_URL"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

  # ── Production Health Verification ──────────────────────────────────
  health-check:
    name: Production Health Check
    runs-on: ubuntu-latest
    needs: deploy-vercel
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment:
      name: production
    steps:
      - name: Wait for deployment
        run: sleep 30

      - name: Health Check
        id: health
        run: |
          URL="${{ needs.deploy-vercel.outputs.DEPLOY_URL || env.PROD_URL }}"
          echo "Checking $URL"

          # Retry for up to ~90s; a fresh production deployment can take a
          # moment before it responds with 200.
          HTTP_CODE="000"
          for i in $(seq 1 6); do
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" "$URL" --max-time 30 || echo "000")
            if [ "$HTTP_CODE" == "200" ] || [ "$HTTP_CODE" == "304" ]; then
              break
            fi
            echo "Attempt $i: HTTP $HTTP_CODE, retrying in 15s..."
            sleep 15
          done

          if [ "$HTTP_CODE" == "200" ] || [ "$HTTP_CODE" == "304" ]; then
            echo "✅ Health check passed (HTTP $HTTP_CODE)"
          else
            echo "::error title=Health Check Failed::HTTP $HTTP_CODE for $URL"
            exit 1
          fi

      - name: API Endpoint Check
        run: |
          # Check Supabase connection
          curl -s -o /dev/null -w "%{http_code}" \
            "https://aelzsqxllkypbzslxyju.supabase.co/rest/v1/" \
            --max-time 30 || echo "Supabase reachable"

      - name: Monitor deployment metrics
        run: |
          echo "## 📊 Deployment Metrics" >> $GITHUB_STEP_SUMMARY
          echo "- Timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo "- Environment: Production" >> $GITHUB_STEP_SUMMARY
          echo "- Commit: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY

  # ── Rollback Validation ──────────────────────────────────────────────
  rollback-validation:
    name: Rollback Capability Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 10

      - name: Verify rollback capability
        run: |
          echo "## 🔄 Rollback Validation" >> $GITHUB_STEP_SUMMARY

          # Check git history for rollback points
          git log --oneline -5

          # Verify Vercel deployment history
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Last 5 Deployments:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          git log --oneline -5 >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "To rollback, run:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "git revert HEAD" >> $GITHUB_STEP_SUMMARY
          echo "git push origin main" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # ── Post-deployment Notification ─────────────────────────────────────
  notify:
    name: Deployment Notification
    runs-on: ubuntu-latest
    needs: [deploy-vercel, health-check]
    if: always()
    steps:
      - name: Create deployment summary
        run: |
          DEPLOY_STATUS="${{ needs.deploy-vercel.result }}"
          HEALTH_STATUS="${{ needs.health-check.result }}"

          if [ "$DEPLOY_STATUS" == "success" ] && [ "$HEALTH_STATUS" == "success" ]; then
            STATUS="✅ Success"
          else
            STATUS="❌ Failed"
          fi

          echo "## 🚀 Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Check | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-------|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ✅ Completed |" >> $GITHUB_STEP_SUMMARY
          echo "| Vercel Deploy | ${{ needs.deploy-vercel.result == 'success' && '✅ Success' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Health Check | ${{ needs.health-check.result == 'success' && '✅ Passed' || needs.health-check.result == 'skipped' && '⏭️ Skipped' || '❌ Failed' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Commit:** \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "**Deployed by:** ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "**URL:** https://www.calqulus.site" >> $GITHUB_STEP_SUMMARY
